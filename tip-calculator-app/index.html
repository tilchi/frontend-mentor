<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Tip calculator app</title>
  <!-- font css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <!-- style code -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="main">
    <h1 class="heading">SPLI<br>TTER</h1>

    <section id="tip-calculator-app" class="tip-calculator-app">

      <div class="tip-calculator-app__container">

        <div class="tip-calculator-app__calculation">

          <div class="tip-calculator-app__bill">
            <h2 class="header-textHeading">Bill</h2>
            <div class="tip-calculator-app__input-wrapper">
              <img src="images/icon-dollar.svg" alt="">
              <input type="text" placeholder="0" name="bill" class="inputs">
            </div>

          </div>
          <div class="tip-calculator-app__tips">
            <h2 class="header-textHeading">Select Tip % </h2>
            <div class="tip-calculator-app__tip-boxs">
              <div class="tip-calculator-app__tip">5%</div>
              <div class="tip-calculator-app__tip">10%</div>
              <div class="tip-calculator-app__tip">15%</div>
              <div class="tip-calculator-app__tip">25%</div>
              <div class="tip-calculator-app__tip">50%</div>
              <div class="tip-calculator-app__tip" contenteditable="true">Custom</div>
            </div>

          </div>

          <div class="tip-calculator-app__people">
            <h2 class="header-textHeading">Number of People</h2>
            <div class="tip-calculator-app__input-wrapper">
              <img src="images/icon-person.svg" alt="">
              <input type="text" placeholder="0" name="people" class="inputs">
            </div>
          </div>

        </div>


        <div class="tip-calculator-app__result">
          <div class="tip-calculator-app__result-header">
            <div class="tip-calculator-app__result-header-info">
              <h2 class="tip-calculator-app__result-heading">Tip Amount </h2>
              <p>/ person</p>
            </div>
            <div class="tip-calculator-app__result-header-price">
              <p class="tip-calculator-app__result-price">&dollar;4.27</p>
            </div>
          </div>
          <div class="tip-calculator-app__result-footer">
            <div class="tip-calculator-app__result-footer-info">
              <h2>Total</h2>
              <p>/ person</p>
            </div>
            <div class="tip-calculator-app__result-footer-price">
              <p class="tip-calculator-app__result-price">&dollar;32.79</p>
            </div>

          </div>
          <button class="tip-calculator-app__reset">RESET</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/tilchi">Fatih Keles</a>.
  </footer>
</body>

</html>
